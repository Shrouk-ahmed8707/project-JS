<body>

    <!-- form Login -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <img src="images/Gemini_Generated_Image_7cnqp77cnqp77cnq.png"  style="width: 50px; height: 50px; border-radius: 8px;">

    <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="index.html">Home</a>
        </li>
        <li class="nav-item">

      </ul>
    
     
      <a class="btn btn-outline-primary me-3" href="login.html" role="button">Login</a>
         <a class="btn btn-primary " href="register.html" role="button">Register</a>
    </div>
  </div>

    <div class="auth-container container">
        <div class="row auth-form-wrapper w-100 mx-auto" style="max-width: 900px;">
            <div class="col-lg-6 col-12 auth-form-content">
                <h2 class="text-center">Welcome Back</h2>
                <p class="text-center text-muted mb-4">Please login to your account</p>
                <form>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control auth-input" id="username" placeholder="Enter your username">
                    </div>

                    <div class="mb-4">
                        <label for="inputPassword" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control auth-input" id="inputPassword" placeholder="Enter your password">
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="flexCheckDefault">
                        <label class="form-check-label text-muted" for="flexCheckDefault">Remember me</label>
                    </div>

                    <button class="btn btn-primary w-100 auth-btn" id="btn_login">Login</button>
                    <p class="mt-4 text-center text-muted">Don't have an account? <a class="auth-link" href="register.html">Register</a></p>
                </form>
            </div>
            <div class="col-lg-6 col-12 p-0 d-none d-lg-block">
                <img src="images/Gemini_Generated_Image_7cnqp77cnqp77cnq.png" class="auth-image" alt="login Image">
            </div>
        </div>
    </div>

<script src="js/login.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
