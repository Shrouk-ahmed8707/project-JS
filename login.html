    <div class="container mt-5 mb-5 p-4 p-md-5 rounded-3 shadow-lg bg-light text-dark">
    <div class="row align-items-center">
        
        <div class="col-lg-6 col-12 mb-4 mb-lg-0">
            <h2 class="text-center">Create your account</h2>
            <hr>
            <form>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username">
                </div>

                <div class="mb-3">
                    <label for="inputPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="inputPassword">
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="flexCheckDefault">
                    <label class="form-check-label" for="flexCheckDefault">Remember me</label>
                </div>

                <button class="btn btn-primary w-100 mt-3 fw-bold" id="btn_login">Login</button>
                <p class="mt-3 text-center">Don't have an account? <a class="text-primary fw-bold" href="register.html">Register</a></p>
            </form>
        </div>

        <div class="col-lg-6 col-12 text-center">
            <div class="img-wrapper p-3">
                <img src="images/pexels-karola-g2-6320.jpg" 
                     class="img-fluid rounded-4 shadow" 
                     style="max-height: 450px; width: 100%; object-fit: cover;" 
                     alt="login Image">
            </div>
        </div>

    </div>
</div>
