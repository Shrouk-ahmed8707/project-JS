<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- register Form -->

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <img src="images/Gemini_Generated_Image_7cnqp77cnqp77cnq.png" style="width: 50px; height: 50px; border-radius: 8px;">

            <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link " href="#" tabindex="-1" aria-disabled="true">Contact us</a>
                    </li>
                </ul>


                <a class="btn btn-outline-primary me-3" href="login.html" role="button">Login</a>
                <a class="btn btn-primary " href="register.html" role="button">Register</a>
            </div>
        </div>
    </nav>

    <div class="auth-container container">
        <div class="row auth-form-wrapper w-100 mx-auto flex-row-reverse" style="max-width: 900px;">
            <div class="col-lg-6 col-12 auth-form-content">
                <h2 class="text-center">Create Account</h2>
                <p class="text-center text-muted mb-4">Join our premium beauty store</p>
                <form action="">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control auth-input" id="username" placeholder="Choose a username">
                    </div>

                    <div class="mb-3">
                        <label for="Email" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control auth-input" id="Email" placeholder="Enter your email">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control auth-input" id="password" placeholder="Create a strong password">
                    </div>
                    
                    <button class="btn btn-primary w-100 auth-btn" id="btn_register">Register</button>
                    <p class="mt-4 text-center text-muted">Already have an account? <a href="login.html" class="auth-link">Login</a></p>
                </form>
            </div>
            <div class="col-lg-6 col-12 p-0 d-none d-lg-block">
                <img src="images/Gemini_Generated_Image_7cnqp77cnqp77cnq.png" class="auth-image" alt="Register Image">
            </div>
        </div>
    </div>



    <script src="js/register.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
